name: Godot startup and gameplay tests
on:
  push:
    branches: [main]
    paths: ['project.godot', 'scenes/**', 'scripts/**', 'tests/**', 'addons/**', 'data/**', 'save_system/**', '.github/workflows/godot-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install verified Godot 4.7.2
        run: |
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          printf '%s  %s\n' 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65 "$RUNNER_TEMP/$archive" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          "$RUNNER_TEMP/godot-bin/godot" --version | grep -E '^4\.7\.2\.stable\.'
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Headless startup without test dependencies
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/tamu-import.log"
          godot --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/tamu-startup.log"
          if grep -Eq 'SCRIPT ERROR|ERROR:|Parse Error' "$RUNNER_TEMP"/tamu-{import,startup}.log; then
            exit 1
          fi

      # MIT: https://github.com/godot-gdunit-labs/gdUnit4/blob/d18770221c2df4a3c991a42fdce7907df40eea75/LICENSE
      - name: Install GdUnit4 v6.2.0 into a CI-only project copy
        run: |
          pin=d18770221c2df4a3c991a42fdce7907df40eea75
          work="$RUNNER_TEMP/tamu-test"
          mkdir -p "$work/addons"
          cp -R project.godot scenes scripts tests addons data save_system state_machine "$work/"
          rm "$work/tests/.gdignore"
          git init -q "$RUNNER_TEMP/gdunit-source"
          git -C "$RUNNER_TEMP/gdunit-source" fetch --quiet --depth=1 https://github.com/godot-gdunit-labs/gdUnit4.git "$pin"
          git -C "$RUNNER_TEMP/gdunit-source" archive FETCH_HEAD addons/gdUnit4 | tar -x -C "$work"
          grep -q '^version="6.2.0"$' "$work/addons/gdUnit4/plugin.cfg"
          git -C "$RUNNER_TEMP/gdunit-source" show FETCH_HEAD:LICENSE > "$work/addons/gdUnit4/LICENSE"
          grep -q '^MIT License' "$work/addons/gdUnit4/LICENSE"

      - name: GdUnit4 movement, inventory, save, quest, combat, state machine, survival, interaction feedback, and Gohud tests
        working-directory: ${{ runner.temp }}/tamu-test
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/tamu-test-import.log"
          godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests/prototype_test.gd --ignoreHeadlessMode 2>&1 | tee "$RUNNER_TEMP/tamu-gdunit.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP"/tamu-{test-import,gdunit}.log; then
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path("reports").rglob("*.xml"))
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          expected = {
              "test_floor_touch_moves_player",
              "test_touch_selects_exact_object",
              "test_inventory_transfers_both_directions_through_selected_chest",
              "test_inventory_partial_transfer_stops_at_target_capacity",
              "test_inventory_full_target_preserves_source_and_total",
              "test_save_round_trip_restores_player_inventory_and_world_pickup",
              "test_interrupted_write_recovers_last_good_state",
              "test_corrupt_or_unsupported_save_does_not_mutate_live_state",
              "test_partial_quest_progress_survives_save_and_load",
              "test_failed_collection_does_not_advance_quest",
              "test_claimed_reward_is_not_granted_twice_after_load",
              "test_full_bag_reward_is_atomic_and_remains_unclaimed",
              "test_legacy_save_without_quest_fields_loads_default_quest_state",
              "test_combat_hit_uses_real_2d_collision",
              "test_combat_miss_outside_range_does_not_damage",
              "test_combat_same_attack_cannot_damage_target_twice",
              "test_combat_death_signal_is_emitted_once",
              "test_fsm_passive_animal_flees_and_returns_to_roam",
              "test_fsm_enemy_windup_prevents_early_damage",
              "test_fsm_enemy_recovery_blocks_next_attack",
              "test_fsm_enemy_death_stops_behavior_and_attack",
              "test_fsm_invalid_transition_is_rejected",
              "test_survival_day_night_fixed_steps_and_wrap",
              "test_survival_hunger_and_thirst_progress_once_per_step",
              "test_survival_deprivation_damages_existing_health_once",
              "test_survival_death_uses_existing_health_path",
              "test_interaction_feedback_highlights_exact_tapped_target",
              "test_interaction_feedback_replaces_target_and_clears_on_empty_touch",
              "test_interaction_feedback_out_of_range_does_not_enable_interaction",
              "test_gohud_quantities_follow_rubonnek_transfer_and_load",
              "test_gohud_touch_is_consumed_before_world_input",
              "test_gohud_back_closes_open_bag_before_world_behavior",
              "test_gohud_injected_safe_area_fits_narrow_and_wide",
          }
          passed = {case.attrib.get("name") for case in cases if not any(case.find(x) is not None for x in ("failure", "error", "skipped"))}
          if not expected <= passed:
              raise SystemExit(f"Missing passing tests: {expected - passed}; recorded: {passed}")
          print("Verified all thirty-three required JUnit test cases passed.")
          PY
    defaults:
      run:
        shell: bash
