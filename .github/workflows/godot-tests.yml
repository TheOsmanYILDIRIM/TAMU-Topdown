name: Godot startup and gameplay tests
on:
  push:
    branches: [main]
    paths: ['project.godot', 'export_presets.cfg', 'scenes/**', 'scripts/**', 'tests/**', 'addons/**', 'assets/**', 'data/**', 'save_system/**', 'tools/better_tile_editor/**', '.github/workflows/godot-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install verified Godot 4.7.2
        run: |
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          printf '%s  %s\n' 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65 "$RUNNER_TEMP/$archive" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          "$RUNNER_TEMP/godot-bin/godot" --version | grep -E '^4\.7\.2\.stable\.'
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Headless startup without test dependencies
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/tamu-import.log"
          godot --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/tamu-startup.log"
          if grep -Eq 'SCRIPT ERROR|ERROR:|Parse Error' "$RUNNER_TEMP"/tamu-{import,startup}.log; then
            exit 1
          fi

      # MPL-2.0: https://github.com/cidwel/BetterTileEditor/blob/67ce337a2b7f56dec46ac4ad40ec90e2ffca2b9d/addons/better-tile-editor/LICENSE.md
      - name: Better Tile Editor 0.3.0 authoring-only native TileSet and TileMapLayer smoke
        run: |
          pin=67ce337a2b7f56dec46ac4ad40ec90e2ffca2b9d
          source_dir="$RUNNER_TEMP/better-tile-editor-source"
          author_dir="$RUNNER_TEMP/better-tile-editor-author"
          clean_dir="$RUNNER_TEMP/better-tile-editor-clean"

          git init -q "$source_dir"
          git -C "$source_dir" fetch --quiet --depth=1 https://github.com/cidwel/BetterTileEditor.git "$pin"
          git -C "$source_dir" show FETCH_HEAD:addons/better-tile-editor/plugin.cfg > "$RUNNER_TEMP/bte-plugin.cfg"
          git -C "$source_dir" show FETCH_HEAD:addons/better-tile-editor/LICENSE.md > "$RUNNER_TEMP/bte-LICENSE.md"
          grep -Fxq 'version="0.3.0"' "$RUNNER_TEMP/bte-plugin.cfg"
          grep -Fxq 'Mozilla Public License Version 2.0' "$RUNNER_TEMP/bte-LICENSE.md"

          mkdir -p "$author_dir"
          git -C "$source_dir" archive FETCH_HEAD addons/better-tile-editor | tar -x -C "$author_dir"
          cp tools/better_tile_editor/author_native_map.gd "$author_dir/author_native_map.gd"
          cp tools/better_tile_editor/native_tile.svg "$author_dir/native_tile.svg"
          cat > "$author_dir/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="Better Tile Editor authoring smoke"

          [autoload]
          BetterTerrain="*res://addons/better-tile-editor/BetterTerrain.gd"

          [editor_plugins]
          enabled=PackedStringArray("res://addons/better-tile-editor/plugin.cfg")

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          godot --headless --path "$author_dir" --editor --import 2>&1 | tee "$RUNNER_TEMP/bte-author-import.log"
          godot --headless --path "$author_dir" -s res://author_native_map.gd 2>&1 | tee "$RUNNER_TEMP/bte-author.log"
          test -s "$author_dir/out/native_tileset.tres"
          test -s "$author_dir/out/native_map.tscn"

          mkdir -p "$clean_dir/out"
          cp "$author_dir/out/native_tileset.tres" "$clean_dir/out/native_tileset.tres"
          cp "$author_dir/out/native_map.tscn" "$clean_dir/out/native_map.tscn"
          cp tools/better_tile_editor/native_tile.svg "$clean_dir/native_tile.svg"
          cp tools/better_tile_editor/verify_native_map.gd "$clean_dir/verify_native_map.gd"
          cat > "$clean_dir/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="Native tile output validation"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          test ! -e "$clean_dir/addons/better-tile-editor"
          ! grep -q 'BetterTerrain' "$clean_dir/project.godot"
          godot --headless --path "$clean_dir" --editor --import 2>&1 | tee "$RUNNER_TEMP/bte-clean-import.log"
          godot --headless --path "$clean_dir" -s res://verify_native_map.gd 2>&1 | tee "$RUNNER_TEMP/bte-clean-verify.log"

          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP"/bte-{author-import,author,clean-import,clean-verify}.log; then
            exit 1
          fi
          if grep -R -Eq 'better-tile-editor|BetterTerrain|_better_terrain' "$clean_dir/out"; then
            echo "Generated native resources retained an editor-addon dependency."
            exit 1
          fi

      # MIT: https://github.com/Minato-chen/godot-spriteframes-batch-importer/blob/6a728af784dcc9affb01622374f9ae6d967421f2/addons/spriteframes_batch_importer/LICENSE
      - name: SpriteFrames Batch Importer editor authoring and plugin-free AnimatedSprite2D
        run: |
          set -euo pipefail
          pin=6a728af784dcc9affb01622374f9ae6d967421f2
          source_dir="$RUNNER_TEMP/spriteframes-source"
          author="$RUNNER_TEMP/spriteframes-author"
          clean="$RUNNER_TEMP/spriteframes-clean"
          addon=addons/spriteframes_batch_importer

          git init -q "$source_dir"
          git -C "$source_dir" fetch --quiet --depth=1 https://github.com/Minato-chen/godot-spriteframes-batch-importer.git "$pin"
          test "$(git -C "$source_dir" rev-parse FETCH_HEAD)" = "$pin"
          mkdir -p "$author" "$clean"
          git -C "$source_dir" archive "$pin" "$addon" | tar -x -C "$author"
          grep -Fxq 'MIT License' "$author/$addon/LICENSE"
          grep -Fxq 'Copyright (c) 2026 CHEN YANGGANG' "$author/$addon/LICENSE"

          cat > "$clean/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="Native SpriteFrames smoke"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cp "$clean/project.godot" "$author/project.godot"
          cat >> "$author/project.godot" <<'EOF'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/spriteframes_batch_importer/plugin.cfg")
          EOF

          # Four direction palettes, five distinct pose markers, one blank spacer column.
          python3 - "$author/sample.svg" <<'PY'
          from pathlib import Path
          import sys

          shapes = ['<svg xmlns="http://www.w3.org/2000/svg" width="62" height="43" viewBox="0 0 62 43">']
          for row, color in enumerate(("#df5544", "#4baa67", "#557fe0", "#d9ae36")):
              for column in (0, 1, 3, 4, 5):
                  x, y = 2 + 10 * column, 3 + 10 * row
                  shapes.append(f'<rect x="{x}" y="{y}" width="8" height="8" fill="{color}"/>')
                  shapes.append(f'<rect x="{x + column + 1}" y="{y + 3}" width="1" height="2" fill="#ffffff"/>')
          shapes.append("</svg>")
          Path(sys.argv[1]).write_text("\n".join(shapes), encoding="utf-8")
          PY

          cat > "$author/author.gd" <<'EOF'
          extends SceneTree

          const Generator = preload("res://addons/spriteframes_batch_importer/spriteframes_generator.gd")

          func _initialize() -> void:
              var sheet := load("res://sample.svg") as Texture2D
              if sheet == null:
                  push_error("Could not import fixture texture")
                  quit(1)
                  return
              var states: Array[Dictionary] = [
                  {"name": "idle", "frame_count": 2, "loop": true, "fps": 6.0, "start_column": 0},
                  {"name": "walk", "frame_count": 3, "loop": true, "fps": 10.0, "start_column": 3},
              ]
              var directions: Array[Dictionary] = [
                  {"name": "left", "row": 2}, {"name": "down", "row": 1},
                  {"name": "right", "row": 0}, {"name": "up", "row": 3},
              ]
              var frames: SpriteFrames = Generator.new().build(
                  sheet, Vector2i(8, 8), Vector2i(2, 3), Vector2i(2, 2), states, directions
              )
              var result := ResourceSaver.save(frames, "res://sample_frames.tres")
              if result != OK:
                  push_error("SpriteFrames save failed: %s" % error_string(result))
                  quit(1)
                  return
              quit(0)
          EOF

          cat > "$clean/verify.gd" <<'EOF'
          extends SceneTree

          const ROWS := {"right": 0, "down": 1, "left": 2, "up": 3}
          const COLUMNS := {"idle": [0, 1], "walk": [3, 4, 5]}

          func _initialize() -> void:
              var sprite := AnimatedSprite2D.new()
              root.add_child.call_deferred(sprite)
              _verify.call_deferred(sprite)

          func _verify(sprite: AnimatedSprite2D) -> void:
              var error := _check(sprite)
              sprite.free()
              if not error.is_empty():
                  push_error(error)
                  quit(1)
                  return
              print("Verified 8 animations and 20 ordered atlas frames in plugin-free AnimatedSprite2D.")
              quit(0)

          func _check(sprite: AnimatedSprite2D) -> String:
              var frames := load("res://sample_frames.tres") as SpriteFrames
              if frames == null or frames.get_animation_names().size() != 8:
                  return "Expected a native resource with exactly eight animations"
              sprite.sprite_frames = frames
              for state: String in COLUMNS:
                  var columns: Array = COLUMNS[state]
                  for direction: String in ROWS:
                      var name := StringName(state + "_" + direction)
                      var count := columns.size()
                      if not frames.has_animation(name) or frames.get_frame_count(name) != count:
                          return "Incorrect animation name or frame count: %s" % name
                      sprite.play(name)
                      if not sprite.is_playing() or sprite.animation != name:
                          return "AnimatedSprite2D did not play %s" % name
                      for index in count:
                          var column: int = columns[index]
                          var row: int = ROWS[direction]
                          var expected := Rect2(2 + 10 * column, 3 + 10 * row, 8, 8)
                          var frame := frames.get_frame_texture(name, index) as AtlasTexture
                          if frame == null or frame.region != expected or frame.atlas == null:
                              return "Incorrect direction or frame order: %s[%d]" % [name, index]
                          if frame.atlas.resource_path != "res://sample.svg":
                              return "Unexpected atlas dependency: %s[%d]" % [name, index]
                          sprite.set_frame_and_progress(index, 0.0)
                          if sprite.frame != index:
                              return "AnimatedSprite2D did not select %s[%d]" % [name, index]
              return ""
          EOF

          godot --headless --path "$author" --editor --import 2>&1 | tee "$RUNNER_TEMP/spriteframes-editor.log"
          godot --headless --path "$author" -s res://author.gd 2>&1 | tee "$RUNNER_TEMP/spriteframes-author.log"
          test -s "$author/sample_frames.tres"

          cp "$author/sample.svg" "$author/sample_frames.tres" "$clean/"
          test ! -e "$clean/addons"
          if grep -Eq '^\[(autoload|editor_plugins)\]' "$clean/project.godot" ||
             grep -Eq 'res://addons/|type="Script"' "$clean/sample_frames.tres"; then
            exit 1
          fi
          godot --headless --path "$clean" --editor --import 2>&1 | tee "$RUNNER_TEMP/spriteframes-import.log"
          godot --headless --path "$clean" -s res://verify.gd 2>&1 | tee "$RUNNER_TEMP/spriteframes-verify.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP"/spriteframes-{editor,author,import,verify}.log; then
            exit 1
          fi

      # MIT: https://github.com/godot-gdunit-labs/gdUnit4/blob/d18770221c2df4a3c991a42fdce7907df40eea75/LICENSE
      - name: Install GdUnit4 v6.2.0 into a CI-only project copy
        run: |
          pin=d18770221c2df4a3c991a42fdce7907df40eea75
          work="$RUNNER_TEMP/tamu-test"
          mkdir -p "$work/addons"
          cp -R project.godot scenes scripts tests addons assets data save_system state_machine "$work/"
          rm "$work/tests/.gdignore"
          git init -q "$RUNNER_TEMP/gdunit-source"
          git -C "$RUNNER_TEMP/gdunit-source" fetch --quiet --depth=1 https://github.com/godot-gdunit-labs/gdUnit4.git "$pin"
          git -C "$RUNNER_TEMP/gdunit-source" archive FETCH_HEAD addons/gdUnit4 | tar -x -C "$work"
          grep -q '^version="6.2.0"$' "$work/addons/gdUnit4/plugin.cfg"
          git -C "$RUNNER_TEMP/gdunit-source" show FETCH_HEAD:LICENSE > "$work/addons/gdUnit4/LICENSE"
          grep -q '^MIT License' "$work/addons/gdUnit4/LICENSE"

      - name: GdUnit4 gameplay, Gohud, pause, and persistent audio settings tests
        working-directory: ${{ runner.temp }}/tamu-test
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/tamu-test-import.log"
          godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests/prototype_test.gd --ignoreHeadlessMode 2>&1 | tee "$RUNNER_TEMP/tamu-gdunit.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP"/tamu-{test-import,gdunit}.log; then
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path("reports").rglob("*.xml"))
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          expected = {
              "test_floor_touch_moves_player",
              "test_touch_selects_exact_object",
              "test_inventory_transfers_both_directions_through_selected_chest",
              "test_inventory_partial_transfer_stops_at_target_capacity",
              "test_inventory_full_target_preserves_source_and_total",
              "test_save_round_trip_restores_player_inventory_and_world_pickup",
              "test_interrupted_write_recovers_last_good_state",
              "test_corrupt_or_unsupported_save_does_not_mutate_live_state",
              "test_partial_quest_progress_survives_save_and_load",
              "test_failed_collection_does_not_advance_quest",
              "test_claimed_reward_is_not_granted_twice_after_load",
              "test_full_bag_reward_is_atomic_and_remains_unclaimed",
              "test_legacy_save_without_quest_fields_loads_default_quest_state",
              "test_combat_hit_uses_real_2d_collision",
              "test_combat_miss_outside_range_does_not_damage",
              "test_combat_same_attack_cannot_damage_target_twice",
              "test_combat_death_signal_is_emitted_once",
              "test_fsm_passive_animal_flees_and_returns_to_roam",
              "test_fsm_enemy_windup_prevents_early_damage",
              "test_fsm_enemy_recovery_blocks_next_attack",
              "test_fsm_enemy_death_stops_behavior_and_attack",
              "test_fsm_invalid_transition_is_rejected",
              "test_survival_day_night_fixed_steps_and_wrap",
              "test_survival_hunger_and_thirst_progress_once_per_step",
              "test_survival_deprivation_damages_existing_health_once",
              "test_survival_death_uses_existing_health_path",
              "test_interaction_feedback_highlights_exact_tapped_target",
              "test_interaction_feedback_replaces_target_and_clears_on_empty_touch",
              "test_interaction_feedback_out_of_range_does_not_enable_interaction",
              "test_gohud_quantities_follow_rubonnek_transfer_and_load",
              "test_gohud_touch_is_consumed_before_world_input",
              "test_gohud_back_closes_open_bag_before_world_behavior",
              "test_gohud_injected_safe_area_fits_narrow_and_wide",
              "test_settings_pause_and_resume_freeze_world_but_menu_keeps_working",
              "test_settings_audio_reload_is_separate_from_game_save",
              "test_settings_missing_or_corrupt_file_uses_safe_audio_defaults",
              "test_settings_back_priority_closes_audio_pause_then_bag",
              "test_settings_touch_pause_is_consumed_before_world_input",
              "test_minimap_tracks_player_marker_in_world_coordinates",
              "test_minimap_uses_world_coordinates_under_transformed_parent",
              "test_minimap_hidden_viewport_stops_and_resumes_rendering",
              "test_minimap_toggle_touch_is_consumed_before_world_input",
          }
          passed = {case.attrib.get("name") for case in cases if not any(case.find(x) is not None for x in ("failure", "error", "skipped"))}
          if not expected <= passed:
              raise SystemExit(f"Missing passing tests: {expected - passed}; recorded: {passed}")
          print("Verified all forty-two required JUnit test cases passed.")
          PY
          rm -rf reports
          godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests/gui_integration_test.gd --ignoreHeadlessMode 2>&1 | tee "$RUNNER_TEMP/tamu-gui-gdunit.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/tamu-gui-gdunit.log"; then
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path("reports").rglob("*.xml"))
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          expected = {
              "test_gui_reference_slot_counts_are_display_only",
              "test_gui_visible_slot_counts_can_change_without_inventory_migration",
              "test_gui_inventory_reflows_inside_injected_safe_area",
              "test_gui_survival_values_are_drawn_from_live_game_state",
              "test_gui_does_not_fabricate_missing_item_icon",
              "test_gui_map_screen_is_componentized_and_render_on_demand",
              "test_gui_legacy_debug_controls_are_not_part_of_runtime_hud",
          }
          passed = {case.attrib.get("name") for case in cases if not any(case.find(x) is not None for x in ("failure", "error", "skipped"))}
          if not expected <= passed:
              raise SystemExit(f"Missing passing GUI tests: {expected - passed}; recorded: {passed}")
          print("Verified all seven GUI integration JUnit cases passed.")
          PY

      - name: Publish verified native SpriteFrames sample
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-spriteframes-sample
          path: |
            ${{ runner.temp }}/spriteframes-clean/sample.svg
            ${{ runner.temp }}/spriteframes-clean/sample_frames.tres
          if-no-files-found: error
    defaults:
      run:
        shell: bash


  android-package:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: headless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install verified Godot 4.7.2
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          printf '%s  %s\n' 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65 "$RUNNER_TEMP/$archive" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot-bin"
          mv "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          "$RUNNER_TEMP/godot-bin/godot" --version | grep -E '^4\.7\.2\.stable\.'
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Install verified official Android export template
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive"
          printf '%s  %s\n' f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011 "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot-template-extract" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/$archive" 'templates/android_debug.apk' -d "$RUNNER_TEMP/godot-template-extract"
          install -m 0644 "$RUNNER_TEMP/godot-template-extract/templates/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK and debug signing key
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          command -v sdkmanager
          command -v adb
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p "$HOME/.local/share/godot/keystores"
          if [ ! -s "$HOME/.local/share/godot/keystores/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.local/share/godot/keystores/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export and verify Android debug APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tamu-apk"
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/tamu-android-import.log"
          godot --headless --path . --export-debug "Android Debug" "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk" 2>&1 | tee "$RUNNER_TEMP/tamu-android-export.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP"/tamu-android-{import,export}.log; then
            exit 1
          fi
          test -s "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk"
          unzip -t "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk" | tee "$RUNNER_TEMP/tamu-apksigner.log"
          sha256sum "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk" | tee "$RUNNER_TEMP/tamu-apk/TAMU-debug.apk.sha256"

      - name: Publish Android debug APK
